name: Foila CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      force-release:
        description: "输入2强制禁用发布，输入1强制发布"
        required: false
        default: ""
      comments:
        description: "发布备注"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ======================
      # 基础环境
      # ======================
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle 权限
        run: chmod +x gradlew

      - name: Git 用户配置
        run: |
          git config --global user.name "ctnBobong32"
          git config --global user.email "actions@262832.xyz"

      # ======================
      # 构建
      # ======================
      - name: 应用补丁
        run: ./gradlew --refresh-dependencies applyAllPatches

      - name: 构建 Paperclip Jar
        run: ./gradlew --refresh-dependencies createMojmapPaperclipJar

      # ======================
      # 变量 & 产物处理
      # ======================
      - name: 处理构建产物并设置变量
        if: github.event_name != 'pull_request'
        run: |
          set -e

          prop() {
            grep "^[[:space:]]*${1}=" gradle.properties | cut -d'=' -f2 | tr -d '\r'
          }

          project_id="foila"
          project_id_b="Foila"

          mcversion=$(prop mcVersion)
          version=$(prop version)
          release=$(prop release)
          commit_id=$(git rev-parse --short HEAD)

          flag_release=false
          pre=false
          make_latest=false

          if [ "$release" = "1" ]; then
            flag_release=true
            pre=true
            make_latest=true
          elif [ "$release" = "2" ]; then
            flag_release=true
            make_latest=true
          fi

          original_jar="foila-server/build/libs/${project_id}-paperclip-${version}-mojmap.jar"
          final_jar="${project_id}-${mcversion}-paperclip.jar"
          final_path="foila-server/build/libs/${final_jar}"

          if [ ! -f "$original_jar" ]; then
            echo "❌ 未找到构建产物"
            find foila-server/build/libs -name "*.jar"
            exit 1
          fi

          mv "$original_jar" "$final_path"

          tag="${mcversion}-${commit_id}"

          echo "project_id=$project_id" >> $GITHUB_ENV
          echo "project_id_b=$project_id_b" >> $GITHUB_ENV
          echo "mcversion=$mcversion" >> $GITHUB_ENV
          echo "commit_id=$commit_id" >> $GITHUB_ENV
          echo "commit_msg=$(git log -1 --pretty='> [%h] %s')" >> $GITHUB_ENV
          echo "jar=$final_jar" >> $GITHUB_ENV
          echo "jar_path=$final_path" >> $GITHUB_ENV
          echo "flag_release=$flag_release" >> $GITHUB_ENV
          echo "pre=$pre" >> $GITHUB_ENV
          echo "make_latest=$make_latest" >> $GITHUB_ENV
          echo "tag=$tag" >> $GITHUB_ENV

      # ======================
      # 上传 CI Artifact（可选）
      # ======================
      - name: 上传 CI 构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Foila-CI
          path: ${{ env.jar_path }}

      # ======================
      # Tag 冲突处理
      # ======================
      - name: 处理 Tag 冲突
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          git fetch --tags
          base="${{ env.tag }}"
          tag="$base"
          i=1

          while git tag -l "$tag" | grep -q .; do
            tag="${base}-${i}"
            i=$((i+1))
          done

          echo "tag=$tag" >> $GITHUB_ENV

      # ======================
      # 创建 GitHub Release
      # ======================
      - name: 创建 GitHub Release
        if: |
          github.event_name != 'pull_request' &&
          env.flag_release == 'true' &&
          inputs.force-release != '2'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: Foila ${{ env.mcversion }} - ${{ env.commit_id }}
          artifacts: ${{ env.jar_path }}
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          generateReleaseNotes: true
          body: |
            📦 版本：`${{ env.mcversion }}`
            🔖 提交：`${{ env.commit_id }}`

            ${{ inputs.comments && format('### 备注\n> {0}', inputs.comments) || '' }}

            ### 分支
            > ${{ github.ref_name }}

            ### 提交信息
            ${{ env.commit_msg }}
          token: ${{ secrets.GITHUB_TOKEN }}