name: 构建

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型 (release-正式版, beta-测试版, alpha-开发版)'
        required: false
        default: 'beta'
        type: choice
        options:
          - release
          - beta
          - alpha
      force_release:
        description: '即使不在main/master分支也强制创建发布 (true/false)'
        required: false
        default: 'false'
        type: boolean
      tag_prefix:
        description: '自定义版本标签前缀 (留空使用默认)'
        required: false
        default: ''
      release_description:
        description: '添加发布描述信息'
        required: false
        default: ''
      skip_patch:
        description: '跳过应用补丁步骤 (true/false)'
        required: false
        default: 'false'
        type: boolean

env:
  default_tag_prefix: "build"

jobs:
  build:
    # 仅当PR的源分支在他人仓库时运行
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出Git仓库
        uses: actions/checkout@v6
        
      - name: 设置JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: 设置Gradle
        uses: gradle/actions/setup-gradle@v5
        
      - name: 配置Git用户信息
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
        
      - name: 应用补丁
        if: ${{ !inputs.skip_patch || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew applyAllPatches --stacktrace
        
      - name: 跳过应用补丁 (手动触发时可选)
        if: ${{ inputs.skip_patch && github.event_name == 'workflow_dispatch' }}
        run: echo "跳过应用补丁步骤"
        
      - name: 构建
        run: ./gradlew build
        
      - name: 获取环境信息
        if: github.event_name != 'pull_request'
        id: env-info
        run: |
          # 获取简短的提交哈希
          commit_short=$(git rev-parse --short HEAD)
          echo "commit_short=$commit_short" >> $GITHUB_OUTPUT
          
          # 获取提交信息
          commit_message=$(git log -1 --pretty=format:"%s")
          # 处理多行提交信息
          commit_message_single_line=$(echo "$commit_message" | tr '\n' ' ' | sed 's/"/\\"/g')
          echo "commit_message=$commit_message_single_line" >> $GITHUB_OUTPUT
          
          # 获取分支名称
          branch_name=${GITHUB_REF#refs/heads/}
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          
          # 确定标签前缀
          tag_prefix="${{ inputs.tag_prefix || env.default_tag_prefix }}"
          echo "tag_prefix=$tag_prefix" >> $GITHUB_OUTPUT
          
          # 生成标签名
          timestamp=$(date +"%Y%m%d-%H%M")
          echo "tag=$tag_prefix-$timestamp-$commit_short" >> $GITHUB_OUTPUT
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          
          # 确定发布类型
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            release_type="${{ inputs.release_type }}"
          else
            # 根据分支名判断发布类型
            if [[ "$branch_name" == "main" || "$branch_name" == "master" ]]; then
              release_type="release"
            elif [[ "$branch_name" == *"beta"* || "$branch_name" == *"test"* ]]; then
              release_type="beta"
            else
              release_type="alpha"
            fi
          fi
          echo "release_type=$release_type" >> $GITHUB_OUTPUT
          
      - name: 查找构建产物
        if: github.event_name != 'pull_request'
        id: find-artifacts
        run: |
          # 查找Jar文件（优先查找paperclip）
          jar_file=$(find . -name "*paperclip*.jar" -type f 2>/dev/null | head -1)
          
          if [ -z "$jar_file" ]; then
            jar_file=$(find . -name "*.jar" -type f | grep -v test | head -1)
          fi
          
          if [ -z "$jar_file" ]; then
            jar_file=$(find . -path "./build/libs/*.jar" -type f | head -1)
          fi
          
          if [ -n "$jar_file" ]; then
            echo "jar_file=$jar_file" >> $GITHUB_OUTPUT
            echo "jar_name=$(basename $jar_file)" >> $GITHUB_OUTPUT
            echo "✅ 找到构建产物: $jar_file"
          else
            echo "❌ 未找到构建产物"
          fi
          
      - name: 上传构建产物
        if: github.event_name != 'pull_request' && steps.find-artifacts.outputs.jar_file
        uses: actions/upload-artifact@v4
        with:
          name: 构建产物
          path: ${{ steps.find-artifacts.outputs.jar_file }}
          
      - name: 创建GitHub发布
        if: |
          github.event_name != 'pull_request' && 
          steps.find-artifacts.outputs.jar_file && 
          (
            github.ref == 'refs/heads/main' || 
            github.ref == 'refs/heads/master' || 
            (github.event_name == 'workflow_dispatch' && inputs.force_release == 'true')
          )
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.env-info.outputs.tag }}
          name: "构建 ${{ steps.env-info.outputs.tag }}"
          body: |
            ## 自动构建发布
            
            这是一个由GitHub Actions自动构建的版本。
            
            **提交**: ${{ steps.env-info.outputs.commit_short }}
            **提交信息**: ${{ steps.env-info.outputs.commit_message }}
            **分支**: ${{ github.ref_name }}
            **构建时间**: ${{ steps.env-info.outputs.timestamp }}
            **发布类型**: ${{ steps.env-info.outputs.release_type }}
            
            ${{ inputs.release_description && format('**发布描述**: {0}', inputs.release_description) || '此版本是自动生成，可能包含实验性功能。' }}
            
          files: ${{ steps.find-artifacts.outputs.jar_file }}
          draft: false
          prerelease: ${{ steps.env-info.outputs.release_type != 'release' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 构建状态总结
        if: always()
        run: |
          echo "=== 构建状态总结 ==="
          echo "事件: ${{ github.event_name }}"
          echo "分支: ${{ github.ref }}"
          echo "提交: ${{ steps.env-info.outputs.commit_short || 'N/A' }}"
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 构建成功"
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ steps.find-artifacts.outputs.jar_file }}" != "" ]; then
              echo "📦 构建产物: ${{ steps.find-artifacts.outputs.jar_name }}"
              if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ] || ( [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.force_release }}" == "true" ] ); then
                echo "🚀 已创建发布: ${{ steps.env-info.outputs.tag }}"
              fi
            fi
          else
            echo "❌ 构建失败"
          fi